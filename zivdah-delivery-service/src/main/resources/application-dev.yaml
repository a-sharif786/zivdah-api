server:
  port: 8013

spring:
  application:
    name: zivdah-delivery-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_delivery  # dedicated history table: zivdahDB is shared across services,
                                          # so each service needs its own version numbering
    baseline-on-migrate: true            # public schema already has other services' tables

  # Without an explicit producer/consumer block, Spring Boot falls back to plain String
  # (de)serializers — DeliveryKafkaProducer's payloads would go out unserialized and
  # OrderEventConsumer would receive the raw JSON text instead of a deserialized
  # OrderStatusChangedEvent, throwing MessageConversionException on every message (confirmed
  # live: "Cannot convert from [java.lang.String] to [OrderStatusChangedEvent]" for every
  # order-status-changed message, so no delivery was ever created for any order). Mirrors
  # zivdah-order-service's own (working) config exactly.
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG
    io.r2dbc: DEBUG

jwt:
  secret: my_super_secret_key_that_is_at_least_32_characters_long_123456
