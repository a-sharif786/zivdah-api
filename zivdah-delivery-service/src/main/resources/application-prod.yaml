server:
  port: 8013

spring:
  application:
    name: zivdah-delivery-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    table: flyway_schema_history_delivery  # dedicated history table: zivdah_db is shared across services,
                                          # so each service needs its own version numbering
    baseline-on-migrate: true            # public schema already has other services' tables

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

order-service:
  url: ${ORDER_SERVICE_URL:http://order-service:8005/restful/v1/api/orders}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

logging:
  level:
    root: WARN

jwt:
  secret: ${JWT_SECRET}

# Shared secret for service-to-service calls (see zivdah-common InternalServiceAuthenticationFilter).
# No fallback on purpose — startup fails unless INTERNAL_API_TOKEN is set (same value in every service).
internal:
  api-token: ${INTERNAL_API_TOKEN}
