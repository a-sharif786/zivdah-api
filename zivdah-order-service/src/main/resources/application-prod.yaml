server:
  port: 8005

spring:
  application:
    name: zivdah-order-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    locations: classpath:db/migration
    table: flyway_schema_history_order   # dedicated history table: zivdah_db is shared across services,
                                          # so each service needs its own version numbering (see V2 checksum collision with product-service)
    baseline-on-migrate: true            # public schema already has other services' tables; baseline this new
                                          # history table at V1 (already-run init) instead of erroring on non-empty schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

# Reached over the compose network by payment-service's Compose service name (see
# docker-compose.yml's "payment-service:" key), NOT localhost — see
# zivdah-delivery-service's application-prod.yaml for the full explanation (same class of bug,
# same fix, applied there first after it silently broke delivery-row creation in production).
payment-service:
  url: ${PAYMENT_SERVICE_URL:http://payment-service:8006/restful/v1/api/payments}

# Reached over the compose network by auth-service's Compose service name — same reasoning as
# payment-service above. Used by InvoiceService/AuthServiceClient to print the customer's
# name/email on a generated invoice.
#
# Deliberately a DIFFERENT env var from AUTH_SERVICE_URL (which zivdah-user-service already
# uses, pointed at the public gateway domain — see its own application-prod.yaml): this call is
# to an unauthenticated /internal/** endpoint (see auth-service's SecurityConfig), so it must
# stay on the internal Docker network and never round-trip through the public gateway, where
# that same unauthenticated path would otherwise be reachable by anyone on the internet.
auth-service:
  url: ${AUTH_SERVICE_INTERNAL_URL:http://auth-service:8002/restful/v1/api/auth}

# Invoice Management (see InvoiceService/InvoicePdfGenerator/InvoiceStorageService). The
# storage path must be a volume shared with (or served directly by) nginx — see
# nginx/invoices-media.conf, which serves this same directory at /media/invoices/.
invoice:
  storage:
    path: ${INVOICE_STORAGE_PATH:/var/www/zivdah-media/invoices/}
  public-base-url: ${INVOICE_PUBLIC_BASE_URL:https://zivdahonlinegrocery.com/media/invoices}
  company:
    name: ${INVOICE_COMPANY_NAME:Zivdah Online Grocery}
    address-line1: ${INVOICE_COMPANY_ADDRESS1:}
    address-line2: ${INVOICE_COMPANY_ADDRESS2:}
    email: ${INVOICE_COMPANY_EMAIL:support@zivdahonlinegrocery.com}
    phone: ${INVOICE_COMPANY_PHONE:}
    website: ${INVOICE_COMPANY_WEBSITE:https://zivdahonlinegrocery.com}
    tax-id: ${INVOICE_COMPANY_TAX_ID:}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

logging:
  level:
    root: WARN

jwt:
  secret: ${JWT_SECRET}
