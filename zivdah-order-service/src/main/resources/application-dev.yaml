server:
  port: 8005

spring:
  application:
    name: zivdah-order-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_order   # dedicated history table: zivdahDB is shared across services,
                                          # so each service needs its own version numbering (see V2 checksum collision with product-service)
    baseline-on-migrate: true            # public schema already has other services' tables; baseline this new
                                          # history table at V1 (already-run init) instead of erroring on non-empty schema

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

# payment-service runs on the same host in dev (see zivdah-payment-service's own
# application-dev.yaml, port 8006) — see application-prod.yaml for why this differs there.
payment-service:
  url: http://localhost:8006/restful/v1/api/payments

# auth-service runs on the same host in dev (port 8002) — see application-prod.yaml for why
# this differs there. Used by InvoiceService/AuthServiceClient to print the customer's
# name/email on a generated invoice.
auth-service:
  url: http://localhost:8002/restful/v1/api/auth

# Invoice Management (see InvoiceService/InvoicePdfGenerator/InvoiceStorageService).
# /var/www/zivdah-media/invoices/ (the prod path) doesn't exist on a dev machine, so this
# points at a project-relative folder instead — see application-prod.yaml for the real path.
invoice:
  storage:
    path: ./media/invoices
  # No nginx in front locally, so this just needs to be *some* well-formed base URL — the
  # frontend should call the authenticated /invoices/{id}/download endpoint regardless (see
  # InvoiceResponseDto#downloadUrl), never this raw one, in every environment.
  public-base-url: http://localhost:8001/media/invoices
  company:
    name: Zivdah Online Grocery
    address-line1: "" # TODO: fill in the registered business address
    address-line2: ""
    email: support@zivdahonlinegrocery.com
    phone: "" # TODO
    website: https://zivdahonlinegrocery.com
    tax-id: "" # TODO: GSTIN/VAT number

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: my_super_secret_key_that_is_at_least_32_characters_long_123456
