server:
  port: 8014

spring:
  application:
    name: zivdah-chat-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_chat   # dedicated history table: zivdahDB is shared across services,
                                          # so each service needs its own version numbering (see order-service's
                                          # V2 checksum collision with product-service, and delivery-service's
                                          # baselined-away V1)
    baseline-on-migrate: true            # public schema already has other services' tables; baseline this new
                                          # history table at V1 (already-run init) instead of erroring on non-empty schema

  kafka:
    bootstrap-servers: localhost:9092

    # Not used yet in Phase 1 (no producer/consumer wired) — present now so later phases
    # (human-handoff events in Phase 3, notification listeners in Phase 5) need no yaml change.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: chat-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: my_super_secret_key_that_is_at_least_32_characters_long_123456

# Inter-service WebClient targets — plain http://localhost:<port> in dev, matching every other
# service's own convention (see order-service/delivery-service's application-dev.yaml).
order-service:
  url: http://localhost:8005/restful/v1/api/orders

payment-service:
  url: http://localhost:8006/restful/v1/api/payments

delivery-service:
  url: http://localhost:8013/restful/v1/api/delivery

product-service:
  url: http://localhost:8003/restful/v1/api/products

coupon-service:
  url: http://localhost:8011/restful/v1/api/coupons

# Same internal, unauthenticated lookup endpoint order-service's InvoiceService already calls —
# reusing that established name/shape rather than inventing a new one.
auth-service:
  url: http://localhost:8002/restful/v1/api/auth

# WaitingConversationEscalationScheduler's direct-REST call into notification-service.
notification-service:
  url: http://localhost:8007/restful/v1/api/notifications
