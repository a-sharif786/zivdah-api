server:
  port: 8007

spring:
  application:
    name: zivdah-notification-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_notification  # dedicated history table: zivdahDB is shared across services,
                                                # so each service needs its own version numbering
    baseline-on-migrate: true                  # public schema already has other services' tables

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

# order-service runs on the same host in dev (see zivdah-order-service's own
# application-dev.yaml, port 8005) â€” see application-prod.yaml for why this differs there.
order-service:
  url: http://localhost:8005/restful/v1/api/orders

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:my_super_secret_key_that_is_at_least_32_characters_long_123456}

# Shared secret for service-to-service calls (see zivdah-common InternalServiceAuthenticationFilter).
# Dev-only fallback so a local IntelliJ run works without extra setup; application-prod.yaml has
# NO fallback, so production fails fast at startup unless INTERNAL_API_TOKEN is set. Must be the
# same value in every service.
internal:
  api-token: ${INTERNAL_API_TOKEN:206384bb376b7f98825a70d8412d5f167e6aaec4793fbecb4d321ccedfdb9861}

# auth-service /internal/** lookups (admin ids, device tokens) â€” see client/AuthServiceClient.
auth-service:
  internal-url: http://localhost:8002/restful/v1/api/auth
