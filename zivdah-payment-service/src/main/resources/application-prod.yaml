server:
  port: 8006

spring:
  application:
    name: zivdah-payment-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    locations: classpath:db/migration
    table: flyway_schema_history_payment  # dedicated history table: zivdah_db is shared across services,
                                           # so each service needs its own version numbering (see zivdah-order-service)
    baseline-on-migrate: true             # public schema already has other services' tables; baseline this new
                                           # history table at V1 (already-run init) instead of erroring on non-empty schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

# Reached over the compose network by order-service's Compose service name (see
# docker-compose.yml's "order-service:" key), NOT localhost — see
# zivdah-delivery-service's application-prod.yaml for the full explanation (same class of bug,
# same fix, applied there first after it silently broke delivery-row creation in production).
order-service:
  url: ${ORDER_SERVICE_URL:http://order-service:8005/restful/v1/api/orders}

# Reached over the compose network by auth-service's Compose service name — same reasoning as
# order-service above. Used by VendorPayoutServiceImpl/AuthServiceClient to fetch a vendor's
# bank/UPI details before submitting a payout.
# NOTE: this hits an unauthenticated /internal/** endpoint (see auth-service's SecurityConfig),
# so it must stay on the internal Docker network and never round-trip through the public
# gateway, where that same unauthenticated path would otherwise be reachable by anyone — same
# reasoning as zivdah-order-service's own AUTH_SERVICE_INTERNAL_URL.
auth-service:
  url: ${AUTH_SERVICE_INTERNAL_URL:http://auth-service:8002/restful/v1/api/auth}

# EcomWorldPay UPI QR (PayIn) + Payout — see application-dev.yaml and .env.example for the same block.
ecomworldpay:
  base-url: ${ECOMWORLDPAY_BASE_URL:https://api.ecomworldpay.net}
  qr-intent-path: /api/registerupiintent
  status-check-path: /api/merchant/transactions/status
  payout-path: /api/payout/payments
  payout-status-path: /api/payout/transStatus
  tenant-id: ${ECOMWORLDPAY_TENANT_ID}
  merchant-id: ${ECOMWORLDPAY_MERCHANT_ID}
  api-key: ${ECOMWORLDPAY_API_KEY}
  secret-key: ${ECOMWORLDPAY_SECRET_KEY}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

logging:
  level:
    root: WARN

jwt:
  secret: ${JWT_SECRET}
