server:
  port: 8006

spring:
  application:
    name: zivdah-payment-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_payment  # dedicated history table: zivdahDB is shared across services,
                                           # so each service needs its own version numbering (see zivdah-order-service)
    baseline-on-migrate: true             # public schema already has other services' tables; baseline this new
                                           # history table at V1 (already-run init) instead of erroring on non-empty schema

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.zivdah.common.event
        spring.json.use.type.headers: true

# order-service runs on the same host in dev (see zivdah-order-service's own
# application-dev.yaml, port 8005) — see application-prod.yaml for why this differs there.
order-service:
  url: http://localhost:8005/restful/v1/api/orders

# auth-service runs on the same host in dev (port 8002) — see application-prod.yaml for why
# this differs there. Used by VendorPayoutServiceImpl/AuthServiceClient to fetch a vendor's
# bank/UPI details on file before submitting a payout.
auth-service:
  url: http://localhost:8002/restful/v1/api/auth

ecomworldpay:
  base-url: ${ECOMWORLDPAY_BASE_URL:https://api.ecomworldpay.net}
  qr-intent-path: /api/registerupiintent
  status-check-path: /api/merchant/transactions/status
  payout-path: /api/payout/payments
  payout-status-path: /api/payout/transStatus
  tenant-id: ${ECOMWORLDPAY_TENANT_ID:TRN053}
  merchant-id: ${ECOMWORLDPAY_MERCHANT_ID:lCqSVz12j6M=NTI=}
  api-key: ${ECOMWORLDPAY_API_KEY:d6618af0-4b61-4313-baa3-08fd1e3a03a3}
  secret-key: ${ECOMWORLDPAY_SECRET_KEY:f4026293-9059-43da-917e-c010746154c4}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: my_super_secret_key_that_is_at_least_32_characters_long_123456
