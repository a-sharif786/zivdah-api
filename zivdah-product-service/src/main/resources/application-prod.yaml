server:
  port: 8003

spring:
  application:
    name: zivdah-product-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    table: flyway_schema_history_product  # dedicated history table: zivdah_db is shared across services,
                                           # so each service needs its own version numbering
    baseline-on-migrate: true             # public schema already has other services' tables

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

# Reached over the compose network by inventory-service's Compose service name (see
# docker-compose.yml's "inventory-service:" key), NOT localhost — see
# zivdah-delivery-service's application-prod.yaml for the full explanation (same class of bug,
# same fix, applied there first after it silently broke delivery-row creation in production).
inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://inventory-service:8008/restful/v1/api/inventory}

# Product/banner image storage (see MediaStorageConfig) — local disk, bind-mounted at the same
# path on host and container (docker-compose.yml) and served by nginx under /media/products/ and
# /media/banners/, exactly like order-service's invoices.
media:
  products:
    storage-path: ${PRODUCT_STORAGE_PATH:/var/www/zivdah-media/products/}
    public-base-url: ${PRODUCT_PUBLIC_BASE_URL:https://zivdahonlinegrocery.com/media/products}
  banners:
    storage-path: ${BANNER_STORAGE_PATH:/var/www/zivdah-media/banners/}
    public-base-url: ${BANNER_PUBLIC_BASE_URL:https://zivdahonlinegrocery.com/media/banners}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

logging:
  level:
    root: WARN
    com.yourpackage: INFO

jwt:
  secret: ${JWT_SECRET}

# Shared secret for service-to-service calls (see zivdah-common InternalServiceAuthenticationFilter).
# No fallback on purpose - startup fails unless INTERNAL_API_TOKEN is set (same value in every service).
internal:
  api-token: ${INTERNAL_API_TOKEN}
