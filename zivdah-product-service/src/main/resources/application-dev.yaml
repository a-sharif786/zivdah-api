server:
  port: 8003

spring:
  application:
    name: zivdah-product-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_product  # dedicated history table: was implicitly using the shared default
                                           # flyway_schema_history table that every other service now moves off of
    baseline-on-migrate: true             # public schema already has other services' tables

  data:
    redis:
      host: localhost
      port: 6380

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

# inventory-service runs on the same host in dev (see zivdah-inventory-service's own
# application-dev.yaml, port 8008) — see application-prod.yaml for why this differs there.
inventory-service:
  url: http://localhost:8008/restful/v1/api/inventory

# Product/banner image storage (see MediaStorageConfig). /var/www/zivdah-media/ (the prod path)
# doesn't exist on a dev machine, so this uses a project-relative folder (gitignored media/) and
# this service serves the files itself at /media/** since there's no nginx locally.
media:
  serve-locally: true
  products:
    storage-path: ./media/products
    public-base-url: http://localhost:8003/media/products
  banners:
    storage-path: ./media/banners
    public-base-url: http://localhost:8003/media/banners

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    io.r2dbc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.yourpackage: DEBUG


jwt:
  secret: ${JWT_SECRET:my_super_secret_key_that_is_at_least_32_characters_long_123456}
# Shared secret for service-to-service calls (see zivdah-common InternalServiceAuthenticationFilter).
# Dev-only fallback; application-prod.yaml has NO fallback (startup fails unless INTERNAL_API_TOKEN is set).
internal:
  api-token: ${INTERNAL_API_TOKEN:206384bb376b7f98825a70d8412d5f167e6aaec4793fbecb4d321ccedfdb9861}
