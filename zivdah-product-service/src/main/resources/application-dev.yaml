server:
  port: 8003

spring:
  application:
    name: zivdah-product-service

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/zivdahDB
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://localhost:5432/zivdahDB
    user: postgres
    password: root
    locations: classpath:db/migration
    table: flyway_schema_history_product  # dedicated history table: was implicitly using the shared default
                                           # flyway_schema_history table that every other service now moves off of
    baseline-on-migrate: true             # public schema already has other services' tables

  data:
    redis:
      host: localhost
      port: 6380

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO
    io.r2dbc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.yourpackage: DEBUG


jwt:
  secret: my_super_secret_key_that_is_at_least_32_characters_long_123456