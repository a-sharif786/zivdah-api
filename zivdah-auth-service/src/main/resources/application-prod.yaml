server:
  port: 8002
  address: 0.0.0.0

spring:
  application:
    name: zivdah-auth-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  flyway:
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:zivdah_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    table: flyway_schema_history_auth  # dedicated history table: zivdah_db is shared across services,
                                        # so each service needs its own version numbering
    baseline-on-migrate: true   # public schema already has other services' tables

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

logging:
  level:
    root: WARN
    com.zivdah: INFO

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${MAIL_FROM_ADDRESS:no-reply@zivdahonlinegrocery.com}

# Mobile OTP via authkey.io 2FA SMS. No fallbacks for the auth key / sid: with provider=authkey
# the service refuses to start unless AUTHKEY_AUTH_KEY and AUTHKEY_SID are set. AUTHKEY_SID is
# the SMS template's SID from the authkey console; the template must contain {#2fa#}.
# base-url must be console.authkey.io: the 2FA endpoints 500 on api.authkey.io.
otp:
  max-attempts: 5
  resend-cooldown: 60s
  sms:
    provider: datagen   # fixed: send/verify OTP always go through DataGenSmsOtpProvider
    authkey:
      base-url: ${AUTHKEY_BASE_URL:https://console.authkey.io}
      auth-key: ${AUTHKEY_AUTH_KEY}
      sid: ${AUTHKEY_SID}
      country-code: ${AUTHKEY_COUNTRY_CODE:91}
    # DataGen 2Factor (generate_otp.php / verify_otp.php) — the active provider. Server IP must be
    # whitelisted in the DataGen panel (else code 407); sender id must be DLT-approved (else 413).
    datagen:
      base-url: ${DATAGEN_BASE_URL:https://global.datagenit.com/API}
      auth-key: ${DATAGEN_AUTH_KEY:}
      sender-id: ${DATAGEN_SENDER_ID:}
      entity-id: ${DATAGEN_ENTITY_ID:}
      template-id: ${DATAGEN_TEMPLATE_ID:}
      country-code: ${DATAGEN_COUNTRY_CODE:91}

jwt:
  secret: ${JWT_SECRET}
  # access token is short-lived; clients renew it via POST /auth/refresh-token
  access-token-expiration: ${JWT_ACCESS_TTL:15m}
  refresh-token-expiration: ${JWT_REFRESH_TTL:7d}

# Shared secret for service-to-service calls (see zivdah-common InternalServiceAuthenticationFilter).
# No fallback on purpose — startup fails unless INTERNAL_API_TOKEN is set (same value in every service).
internal:
  api-token: ${INTERNAL_API_TOKEN}
