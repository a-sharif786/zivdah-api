      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      # order-service.url/payment-service.url/delivery-service.url/product-service.url/
      # coupon-service.url/auth-service.url/notification-service.url all default correctly to
      # http://<compose-service-name>:<port>/... in application-prod.yaml already — no override
