services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres-db:
    image: postgres:17-alpine
    container_name: zivdah-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}


    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - zivdah-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: zivdah-redis
    restart: unless-stopped

    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      # lets the healthcheck's redis-cli authenticate without putting the password on its command line
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - zivdah-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # ZOOKEEPER
  # Required for this Kafka setup
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zivdah-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

    networks:
      - zivdah-network


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: zivdah-kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    # Host-local only. The broker has no authentication, and anyone who could reach the old
    # public 0.0.0.0:9092 could publish a forged "payment-completed" event or read every topic
    # (app-logs included). Services use the INTERNAL listener (kafka:29092) over zivdah-network;
    # the EXTERNAL listener is now only for tools on the host itself (or an SSH tunnel).
    ports:
      - "127.0.0.1:9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      # Advertised as localhost (was the public ${SERVER_IP}) to match the host-local binding above.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - zivdah-network


  # ============================================================
  # EUREKA SERVER
  # ============================================================

  eureka-server:
    build:
      context: ./zivdah-eureka-server
      dockerfile: Dockerfile

    container_name: zivdah-eureka
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761
      # HTTP Basic on the registry/dashboard (see zivdah-eureka-server SecurityConfig). Every
      # client's EUREKA_CLIENT_SERVICEURL_DEFAULTZONE below is built from this same pair, so they
      # can't drift apart. Keep the password URL-safe (no @ : / # ?) since it sits inside a URL.
      EUREKA_USERNAME: ${EUREKA_USERNAME:?EUREKA_USERNAME must be set in .env}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD must be set in .env}

    # Host-local only (dashboard via SSH tunnel: ssh -L 8761:127.0.0.1:8761 <server>). The
    # services register over zivdah-network as eureka-server:8761.
    ports:
      - "127.0.0.1:8761:8761"

    depends_on:
      - kafka

    networks:
      - zivdah-network


  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    build:
      context: ./zivdah-api-gateway
      dockerfile: Dockerfile

    container_name: zivdah-api-gateway
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SERVER_PORT: 8080

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

    # nginx on the host terminates TLS and proxies to 127.0.0.1:8080, so the gateway only needs
    # to be reachable from the host. The old "8080:8080" also exposed it as plain HTTP on the
    # public IP, bypassing TLS entirely. Set GATEWAY_BIND_ADDRESS=0.0.0.0 in .env only if a
    # deployment genuinely needs direct access to the raw port.
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:8080:8080"

    depends_on:
      - eureka-server
      - redis
      - kafka

    networks:
      - zivdah-network


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: ./zivdah-auth-service
      dockerfile: Dockerfile

    container_name: zivdah-auth-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # USER SERVICE
  # ============================================================

  user-service:
    build:
      context: ./zivdah-user-service
      dockerfile: Dockerfile

    container_name: zivdah-user-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka


      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # PRODUCT SERVICE
  # ============================================================

  product-service:
    build:
      context: ./zivdah-product-service
      dockerfile: Dockerfile

    container_name: zivdah-product-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}

      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      # Product/banner image storage (see MediaStorageConfig). Defaults match the bind mounts
      # below; if you change a *_STORAGE_PATH, change its volume line to the same path.
      PRODUCT_STORAGE_PATH: ${PRODUCT_STORAGE_PATH:-/var/www/zivdah-media/products/}

      PRODUCT_PUBLIC_BASE_URL: ${PRODUCT_PUBLIC_BASE_URL:-https://zivdahonlinegrocery.com/media/products}

      BANNER_STORAGE_PATH: ${BANNER_STORAGE_PATH:-/var/www/zivdah-media/banners/}

      BANNER_PUBLIC_BASE_URL: ${BANNER_PUBLIC_BASE_URL:-https://zivdahonlinegrocery.com/media/banners}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

      redis:
        condition: service_healthy

    networks:
      - zivdah-network

    # Same bind-mount model as order-service's invoices: same path on host and container, so
    # nginx on the host serves exactly what this container writes. Create once before deploy:
    #   sudo mkdir -p /var/www/zivdah-media/{products,banners} && sudo chown -R 1000:1000 /var/www/zivdah-media
    volumes:
      - /var/www/zivdah-media/products:/var/www/zivdah-media/products
      - /var/www/zivdah-media/banners:/var/www/zivdah-media/banners


  # ============================================================
  # CART SERVICE
  # ============================================================

  cart-service:
    build:
      context: ./zivdah-cart-service
      dockerfile: Dockerfile

    container_name: zivdah-cart-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # ORDER SERVICE
  # ============================================================

  order-service:
    build:
      context: ./zivdah-order-service
      dockerfile: Dockerfile

    container_name: zivdah-order-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

  
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL}

      INVOICE_STORAGE_PATH: ${INVOICE_STORAGE_PATH}

      INVOICE_PUBLIC_BASE_URL: ${INVOICE_PUBLIC_BASE_URL}

      INVOICE_COMPANY_NAME: ${INVOICE_COMPANY_NAME}

      INVOICE_COMPANY_ADDRESS1: ${INVOICE_COMPANY_ADDRESS1}

      INVOICE_COMPANY_ADDRESS2: ${INVOICE_COMPANY_ADDRESS2}

      INVOICE_COMPANY_EMAIL: ${INVOICE_COMPANY_EMAIL}

      INVOICE_COMPANY_PHONE: ${INVOICE_COMPANY_PHONE}

      INVOICE_COMPANY_WEBSITE: ${INVOICE_COMPANY_WEBSITE}

      INVOICE_COMPANY_TAX_ID: ${INVOICE_COMPANY_TAX_ID}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network

    # Bind-mounted (not a named volume) at the SAME path on host and container so nginx,
    # running directly on the host (see nginx/invoices-media.conf), can serve exactly the files
    # this container writes under /media/invoices/ without any path translation. Create the host
    # directory once, owned by whatever user this container runs as, before first deploy:
    #   sudo mkdir -p /var/www/zivdah-media/invoices && sudo chown -R 1000:1000 /var/www/zivdah-media
    volumes:
      - /var/www/zivdah-media/invoices:/var/www/zivdah-media/invoices


  # ============================================================
  # PAYMENT SERVICE
  # ============================================================

  payment-service:
    build:
      context: ./zivdah-payment-service
      dockerfile: Dockerfile

    container_name: zivdah-payment-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      # See order-service's own use of this var / application-prod.yaml for why it must stay
      # internal-network-only rather than pointing at the public gateway domain.
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL}

      ECOMWORLDPAY_BASE_URL: ${ECOMWORLDPAY_BASE_URL}

      ECOMWORLDPAY_TENANT_ID: ${ECOMWORLDPAY_TENANT_ID}

      ECOMWORLDPAY_MERCHANT_ID: ${ECOMWORLDPAY_MERCHANT_ID}

      ECOMWORLDPAY_API_KEY: ${ECOMWORLDPAY_API_KEY}

      ECOMWORLDPAY_SECRET_KEY: ${ECOMWORLDPAY_SECRET_KEY}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================

  notification-service:
    build:
      context: ./zivdah-notification-service
      dockerfile: Dockerfile

    container_name: zivdah-notification-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      # Firebase Admin SDK key, mounted read-only below — no longer baked into the jar/image.
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-adminsdk.json

    # Place the (rotated) service-account JSON on the server at this path before deploying,
    # e.g. /opt/new_zivdah_backend/secrets/firebase-adminsdk.json, chmod 600. If it's missing,
    # Docker creates an empty directory there and notification-service fails fast at startup.
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-adminsdk.json}:/run/secrets/firebase-adminsdk.json:ro

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # INVENTORY SERVICE
  # ============================================================

  inventory-service:
    build:
      context: ./zivdah-inventory-service
      dockerfile: Dockerfile

    container_name: zivdah-inventory-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # REVIEW SERVICE
  # ============================================================

  review-service:
    build:
      context: ./zivdah-review-service
      dockerfile: Dockerfile

    container_name: zivdah-review-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # COUPON SERVICE
  # ============================================================

  coupon-service:
    build:
      context: ./zivdah-coupon-service
      dockerfile: Dockerfile

    container_name: zivdah-coupon-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # LOG SERVER
  # ============================================================

  log-server:
    build:
      context: ./zivdah-log-server
      dockerfile: Dockerfile

    container_name: zivdah-log-server
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      # The log API is now ADMIN-only and validates auth-service's access tokens.
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # DELIVERY SERVICE
  # ============================================================

  delivery-service:
    build:
      context: ./zivdah-delivery-service
      dockerfile: Dockerfile

    container_name: zivdah-delivery-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


  # ============================================================
  # CHAT SERVICE
  # ============================================================

  chat-service:
    build:
      context: ./zivdah-chat-service
      dockerfile: Dockerfile

    container_name: zivdah-chat-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@eureka-server:8761/eureka

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      # order-service.url/payment-service.url/delivery-service.url/product-service.url/
      # coupon-service.url/auth-service.url/notification-service.url all default correctly to
      # http://<compose-service-name>:<port>/... in application-prod.yaml already — no override
      # needed here unless a deployment needs to point somewhere non-standard (same convention
      # every other inter-service caller in this compose file already follows).

      # Chat attachment storage (see MediaStorageConfig); keep in sync with the volume below.
      CHAT_STORAGE_PATH: ${CHAT_STORAGE_PATH:-/var/www/zivdah-media/chat/}

      CHAT_PUBLIC_BASE_URL: ${CHAT_PUBLIC_BASE_URL:-https://zivdahonlinegrocery.com/media/chat}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network

    #   sudo mkdir -p /var/www/zivdah-media/chat && sudo chown -R 1000:1000 /var/www/zivdah-media
    volumes:
      - /var/www/zivdah-media/chat:/var/www/zivdah-media/chat


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  postgres-data:
    name: zivdah-postgres-data

  redis-data:
    name: zivdah-redis-data

  kafka-data:
    name: zivdah-kafka-data

  zookeeper-data:
    name: zivdah-zookeeper-data

  zookeeper-logs:
    name: zivdah-zookeeper-logs


# ==============================================================
# NETWORK
# ==============================================================

networks:

  zivdah-network:
    name: zivdah-network
    driver: bridge
