      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      # See order-service's own use of this var / application-prod.yaml for why it must stay
      # internal-network-only rather than pointing at the public gateway domain.
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL}

      ECOMWORLDPAY_BASE_URL: ${ECOMWORLDPAY_BASE_URL}

      ECOMWORLDPAY_TENANT_ID: ${ECOMWORLDPAY_TENANT_ID}

      ECOMWORLDPAY_MERCHANT_ID: ${ECOMWORLDPAY_MERCHANT_ID}

      ECOMWORLDPAY_API_KEY: ${ECOMWORLDPAY_API_KEY}

      ECOMWORLDPAY_SECRET_KEY: ${ECOMWORLDPAY_SECRET_KEY}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

