services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres-db:
    image: postgres:17-alpine
    container_name: zivdah-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # No host port published: every service reaches this over zivdah-network
    # via the "postgres-db" DNS name. Publishing 5432 here fights with any
    # native postgres on the host bound to the same port (seen on prod).
    # Use `docker exec -it zivdah-postgres psql -U postgres -d zivdah_db`
    # for direct access instead.

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - zivdah-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: zivdah-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - zivdah-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # ZOOKEEPER
  # Required for this Kafka setup
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zivdah-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

    networks:
      - zivdah-network


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: zivdah-kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${SERVER_IP}:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - zivdah-network


  # ============================================================
  # EUREKA SERVER
  # ============================================================

  eureka-server:
    build:
      context: ./zivdah-eureka-server
      dockerfile: Dockerfile

    container_name: zivdah-eureka
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761

    ports:
      - "8761:8761"

    depends_on:
      - kafka

    networks:
      - zivdah-network


  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    build:
      context: ./zivdah-api-gateway
      dockerfile: Dockerfile

    container_name: zivdah-api-gateway
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SERVER_PORT: 8080

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

    ports:
      - "8080:8080"

    depends_on:
      - eureka-server
      - redis
      - kafka

    networks:
      - zivdah-network


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: ./zivdah-auth-service
      dockerfile: Dockerfile

    container_name: zivdah-auth-service
    restart: unless-stopped

    env_file:
      - .env

    environment:

      SPRING_PROFILES_ACTIVE: prod

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      SPRING_R2DBC_URL: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_R2DBC_USERNAME: ${DB_USERNAME}

      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD}

      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      SPRING_FLYWAY_USER: ${DB_USERNAME}

      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}

      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


