      # every other inter-service caller in this compose file already follows).

    depends_on:
      postgres-db:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-server:
        condition: service_started

    networks:
      - zivdah-network


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  postgres-data:
    name: zivdah-postgres-data

  redis-data:
    name: zivdah-redis-data

  kafka-data:
    name: zivdah-kafka-data

  zookeeper-data:
    name: zivdah-zookeeper-data

  zookeeper-logs:
    name: zivdah-zookeeper-logs


# ==============================================================
# NETWORK
# ==============================================================

networks:

  zivdah-network:
    name: zivdah-network
    driver: bridge
